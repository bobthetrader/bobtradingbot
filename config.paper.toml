# Paper trading — tightened for quality over quantity
# Balance: 500 EUR | Goal: +3-8% per month | R:R = 2.5:1
[kraken_api]
key = ""
secret = ""

[bot_settings]
base_currency = "EUR"
auto_select_pair = true
loop_interval_seconds = 60
trade_pairs = [ "XXBTZEUR", "XETHZEUR", "SOLEUR", "XXRPZEUR", "ADAEUR", "DOTEUR", "LINKEUR",]
allocation_per_trade_percent = 12.0

# Dynamic universe (added 2026-07-02): widen longs beyond the 7 core pairs to any
# liquid EUR pair, refreshed from Kraken every 15 min. Only pairs above the volume
# floor qualify (maker fills need depth); core pairs + held positions are always
# kept. Quality gates + min_buy_score still filter every entry. Paper test — watch
# the long win rate; set dynamic_pairs = false to revert to the 7 core pairs.
# Pulled back 2026-07-03: €750k/day floor => only the ~10 most-liquid EUR pairs
# qualify (BTC/ETH/SOL/XRP/ADA/HYPE/LTC/VVV/M/ZEC). Total universe ~12 (7 core +
# most-liquid additions). Dropped the whippy €250k-band mid-caps (WLD/TAO/SUI…)
# that were churning net-negative on fees. Lower the floor again to re-widen.
dynamic_pairs = true
dynamic_pairs_min_vol_eur = 750000
dynamic_pairs_max = 10
dynamic_pairs_refresh_min = 15

[risk_management]
max_drawdown_percent = 25.0
stop_loss_percent = 1.5              # Wider SL — volatile market needs more room
allocation_per_trade_percent = 12.0 # ~12% of free cash/trade -> ~EUR50-60 buys (was 5% = tiny ~EUR15-25 buys leaving most of the balance idle)
min_trade_eur = 4.0
min_auto_scale_notional = 0.1
min_buy_score = 10.0                 # Needs strong RSI or trend signal
take_profit_percent = 2.0            # 2.0% TP vs 0.8% SL = 2.5:1 ratio
min_net_sell_profit_pct = 0.5
# Gain-protection throttle off for paper: don't cut position sizing after hitting
# the +3%/month target — we want full-size trading to test the wider universe.
enable_monthly_gain_throttle = false
fees_maker_percent = 0.25
fees_taker_percent = 0.40
sell_fee_buffer_percent = 0.40
enable_trading_hours = false
enable_regime_filter = false
enable_volume_filter = false
enable_daily_drawdown = false
enable_bear_shield = false
enable_atr_dynamic_tp = false
enable_mean_reversion_signals = true
mr_rsi_oversold_threshold = 30       # Only buy genuine oversold (RSI < 30)
mr_rsi_overbought_threshold = 70     # Only sell genuine overbought (RSI > 70)
break_even_trigger_percent = 1.0     # Move SL to entry only after +1.0% gain
max_consecutive_losses = 5
pause_after_loss_streak_minutes = 0
max_open_positions = 6               # was 3 — 3 slots stayed full of parked longs, blocking new long entries
time_stop_hours = 24                 # was default 72 — recycle flat/dead-money longs faster so slots free up

[intelligence]
refresh_seconds = 600
score_weight = 0.5

[execution]
signal_refresh_interval_seconds = 300   # 5 min — let signals develop
regime_cache_ttl_seconds = 300

[technical]
enable_ema_crossover_filter = false
enable_mtf_macd_filter = false
ema_fast_period = 9
ema_slow_period = 21

[optimizer]
enabled = true
eval_every_n_trades = 10

[logging]
log_level = "INFO"
log_to_file = true
log_file_path = "data/bot_activity_paper.log"

[backtesting]
historical_data_path = "data/historical_prices.csv"
results_output_path = "backtest_results/"

[reporting]
generate_trade_reports = true
report_output_path = "reports/"
cashflow_refresh_seconds = 600

[paths]
nas_root = "/mnt/fritz_nas/Volume/kraken"

[telegram]
bot_token = ""
chat_id = ""

[bot_settings.trade_amounts]
trade_amount_eur = 35.0   # base; hard cap on any single buy = 2x this = EUR70
initial_balance = 500.0

[shorting]
# Disabled 2026-07-02: shorts were a persistent net loser — 83 trades at 26% WR,
# net -EUR3.59, and only 7.7% WR since the trend_bearish gate (2026-07-01). Longs
# are the profit engine (+EUR6.76, 56% WR). Removing shorts recovers the drag.
# Existing open shorts are still managed/closed (entry gate only); set true to resume.
enabled = false
leverage = "2"
max_short_notional_eur = 30.0
short_take_profit_percent = 1.4
short_stop_loss_percent = 0.5
# Hard backstop: force-close EVERY short past this loss each loop (the normal
# soft stop above closes only one position per loop, so runaways queue up).
short_hard_stop_percent = 1.5

[scalper]
# Paused 2026-07-02: net-of-fee analysis showed the scalper is structurally
# EV-negative at the 0.35% taker tier (round-trip 0.70% > 0.50% stop → 40% net
# breakeven WR vs ~13% actual). Set enabled = true to resume once the strategy
# is redesigned for larger moves or a lower fee tier. Open positions are held on
# disk and will resume management if re-enabled.
enabled = false
# Signal-excursion observer: takes NO trades — for each scalp signal it records
# how far price moves over the next 3h (MFE/MAE + full path) to data/
# scalper_observations.jsonl. Feeds backtest/analyze_observations.py so exit
# geometry can be designed from real data. Safe to run while enabled=false.
probe_enabled = true
