# Paper trading — tightened for quality over quantity
# Balance: 500 EUR | Goal: +3-8% per month | R:R = 2.5:1
[kraken_api]
key = ""
secret = ""

[bot_settings]
base_currency = "EUR"
auto_select_pair = true
loop_interval_seconds = 60
trade_pairs = [ "XXBTZEUR", "XETHZEUR", "SOLEUR", "XXRPZEUR", "ADAEUR", "DOTEUR", "LINKEUR",]
allocation_per_trade_percent = 12.0

# Dynamic universe (added 2026-07-02): widen longs beyond the 7 core pairs to any
# liquid EUR pair, refreshed from Kraken every 15 min. Only pairs above the volume
# floor qualify (maker fills need depth); core pairs + held positions are always
# kept. Quality gates + min_buy_score still filter every entry. Paper test — watch
# the long win rate; set dynamic_pairs = false to revert to the 7 core pairs.
# Pulled back 2026-07-03: €750k/day floor => only the ~10 most-liquid EUR pairs
# qualify (BTC/ETH/SOL/XRP/ADA/HYPE/LTC/VVV/M/ZEC). Total universe ~12 (7 core +
# most-liquid additions). Dropped the whippy €250k-band mid-caps (WLD/TAO/SUI…)
# that were churning net-negative on fees. Lower the floor again to re-widen.
dynamic_pairs = true
dynamic_pairs_min_vol_eur = 750000
dynamic_pairs_max = 10
dynamic_pairs_refresh_min = 15

[risk_management]
max_drawdown_percent = 25.0
stop_loss_percent = 1.5              # Wider SL — volatile market needs more room
min_stop_loss_percent = 1.2          # FLOOR under the regime-aware dynamic SL: the 0.6%
                                     # bearish stop was below the 0.52% round-trip fee, so
                                     # wiggles exited at guaranteed fee-dominated net losses
                                     # (added 2026-07-07). 0 = restore old behaviour.
allocation_per_trade_percent = 12.0 # ~12% of portfolio/trade -> ~EUR58 target
# Floor so the 7 stacked risk multipliers (Kelly ~0.5x, ATR vol-targeting,
# correlation, regime) can't shrink every buy into the EUR20s (added 2026-07-06).
# Buys now land ~EUR50-70 (floor 50, cap = 2x trade_amount_eur = 70), still
# capped by available cash. Set 0 to restore pure multiplier-based sizing.
min_target_trade_eur = 50.0
min_trade_eur = 4.0
min_auto_scale_notional = 0.1
min_buy_score = 10.0                 # Needs strong RSI or trend signal
take_profit_percent = 2.0            # 2.0% TP vs 0.8% SL = 2.5:1 ratio
min_net_sell_profit_pct = 0.5
# Gain-protection throttle off for paper: don't cut position sizing after hitting
# the +3%/month target — we want full-size trading to test the wider universe.
enable_monthly_gain_throttle = false
fees_maker_percent = 0.25
fees_taker_percent = 0.40
sell_fee_buffer_percent = 0.40
enable_trading_hours = false
enable_regime_filter = false
enable_volume_filter = false
enable_daily_drawdown = false
enable_bear_shield = false
enable_atr_dynamic_tp = false
enable_mean_reversion_signals = true
mr_rsi_oversold_threshold = 30       # Only buy genuine oversold (RSI < 30)
mr_rsi_overbought_threshold = 70     # Only sell genuine overbought (RSI > 70)
break_even_trigger_percent = 1.0     # Arm the break-even stop only after +1.0% gain
break_even_offset_pct = 0.7          # BE stop parked at entry+0.7% (covers 0.52% fees + margin), NOT raw entry
trailing_stop_min_gain_pct = 0.8     # Trailing stop can only fire while still >= +0.8% gross (nets positive after fees)
max_consecutive_losses = 5
pause_after_loss_streak_minutes = 60 # was 0 = pause disabled; streak counter is now NET of fees (2026-07-06)
max_open_positions = 6               # was 3 — 3 slots stayed full of parked longs, blocking new long entries
time_stop_hours = 24                 # was default 72 — recycle flat/dead-money longs faster so slots free up

[intelligence]
# AI panel cadence. Raised 600->1800 (2026-07-04) to cut OpenRouter cost ~3x:
# the panel is slow-moving macro sentiment, 10-min refresh was wasteful on a
# <2h-hold bot and cost ~$1/day (≈ all the profit). Because sonar/hermes fire
# every Nth panel run, this stretches ALL of them. Per-model cadence is further
# tuned by env INTEL_EXPENSIVE_EVERY (default 2) and INTEL_SONAR_EVERY (default
# 12; set 0 to disable the pricey Perplexity sonar web-search model entirely).
refresh_seconds = 1800
score_weight = 0.5
# Hard veto: block ALL buys while the combined panel score is <= this value.
# The additive score_weight adjustment (max ~1.5 pts at 0.5) can never outvote
# entry scores of 8-36, so a clearly-bearish panel could not act — 2026-07-05/06
# every entry taken at panel <= -1.5 lost (DOT/LINK bought at -2.95). 0 = off.
buy_veto_score = -1.5

[smart_money]
# Whale exchange flows (Alchemy wallet watch + CoinMetrics daily) + Hyperliquid
# top-trader positioning. Veto blocks buys; boost = size x mult + lower entry
# bar. Missing data always neutral. Journal fields: whale_score / hl_bias /
# smart_action -> re-tune after ~2 weeks of entries.
enabled = true
whale_veto_score = -2.5     # whale_score <= this -> block ALL buys
whale_boost_score = 2.5     # whale_score >= this -> boost
hl_veto_score = -2.5        # hl_bias[pair] <= this -> block buys on that pair
hl_boost_score = 2.5        # hl_bias[pair] >= this -> boost
boost_size_mult = 1.3       # position size x1.3 (still inside EUR70/cash caps)
boost_min_score_delta = -2.0 # entry bar lowered while boosted
min_whale_eth = 250.0       # ignore transfers below this (ETH)
min_whale_stable_usd = 500000.0
hl_roster_size = 20         # top traders followed
hl_min_traders = 3          # min positioned traders before a coin bias counts
hl_min_volume_usd = 50000000.0  # 30d volume floor for roster eligibility

[execution]
signal_refresh_interval_seconds = 300   # 5 min — let signals develop
regime_cache_ttl_seconds = 300

# Trend/momentum confirmation for BUYs (re-enabled 2026-07-03). The entry trigger
# is RSI mean-reversion (counter-trend), so without these the bot bought oversold
# dips inside downtrends that kept falling (fee churn). Both are lenient blockers:
#  - EMA crossover: blocks a BUY only when EMA9 < EMA21 on 1h (confirmed bearish).
#  - MTF MACD: blocks only when BOTH 1h hist < -0.05% AND 15m hist < 0 (both bearish);
#    passes during consolidation / on missing data. Regime + volume filters stay OFF
#    to keep enough trade flow to judge the quality change.
[technical]
enable_ema_crossover_filter = true
enable_mtf_macd_filter = true
ema_fast_period = 9
ema_slow_period = 21
# 1h-RSI ceiling for mean-reversion buys: the entry trigger is a TICK-level dip
# (1-min RSI <= 33), which fired at 1h RSI 60-70 all Saturday 2026-07-05 (buying
# micro-dips at local tops before the dump — all 7 such entries lost). Blocks
# BUY when 1h RSI >= this value on mean_reversion-profile pairs. 0 = off.
max_entry_rsi_1h = 60

[optimizer]
enabled = true
eval_every_n_trades = 10

[logging]
log_level = "INFO"
log_to_file = true
log_file_path = "data/bot_activity_paper.log"

[backtesting]
historical_data_path = "data/historical_prices.csv"
results_output_path = "backtest_results/"

[reporting]
generate_trade_reports = true
report_output_path = "reports/"
cashflow_refresh_seconds = 600

[paths]
nas_root = "/mnt/fritz_nas/Volume/kraken"

[telegram]
bot_token = ""
chat_id = ""

[bot_settings.trade_amounts]
trade_amount_eur = 35.0   # base; hard cap on any single buy = 2x this = EUR70
initial_balance = 500.0

[shorting]
# Disabled 2026-07-02: shorts were a persistent net loser — 83 trades at 26% WR,
# net -EUR3.59, and only 7.7% WR since the trend_bearish gate (2026-07-01). Longs
# are the profit engine (+EUR6.76, 56% WR). Removing shorts recovers the drag.
# Existing open shorts are still managed/closed (entry gate only); set true to resume.
enabled = false
leverage = "2"
max_short_notional_eur = 30.0
short_take_profit_percent = 1.4
short_stop_loss_percent = 0.5
# Hard backstop: force-close EVERY short past this loss each loop (the normal
# soft stop above closes only one position per loop, so runaways queue up).
short_hard_stop_percent = 1.5

[scalper]
# Paused 2026-07-02: net-of-fee analysis showed the scalper is structurally
# EV-negative at the 0.35% taker tier (round-trip 0.70% > 0.50% stop → 40% net
# breakeven WR vs ~13% actual). Set enabled = true to resume once the strategy
# is redesigned for larger moves or a lower fee tier. Open positions are held on
# disk and will resume management if re-enabled.
enabled = false
# Signal-excursion observer: takes NO trades — for each scalp signal it records
# how far price moves over the next 3h (MFE/MAE + full path) to data/
# scalper_observations.jsonl. Feeds backtest/analyze_observations.py so exit
# geometry can be designed from real data. Safe to run while enabled=false.
probe_enabled = true
